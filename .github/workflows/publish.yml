
name: Build and publish archive

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

          - name: Build Jekyll website
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production

      - name: Generate plain-text sitemap
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from urllib.parse import urljoin

          base = "https://closeplayground.github.io/Nathan-Lambert-Archive/"
          root = Path("_site")
          urls = []

          for path in sorted(root.rglob("*.html")):
              relative = path.relative_to(root).as_posix()
              if relative == "index.html":
                  relative = ""
              elif relative.endswith("/index.html"):
                  relative = relative[:-10]
              urls.append(urljoin(base, relative))

          (root / "sitemap.txt").write_text(
              "\n".join(urls) + "\n", encoding="utf-8"
          )
          print(f"Generated sitemap.txt with {len(urls)} URLs")
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy website
        uses: actions/deploy-pages@v4
