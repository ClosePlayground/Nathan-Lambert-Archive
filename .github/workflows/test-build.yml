
name: Test Jekyll build

on:
  push:
    branches:
      - jekyll-upgrade
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Build Jekyll website
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production

     
      - name: Inspect generated website
        run: |
          echo "Current directory:"
          pwd
          echo "Files in repository:"
          ls -la
          echo "Generated website files:"
          ls -la _site || true
          echo "Looking for homepage:"
          find . -name index.html | head -30
          echo "Jekyll configuration:"
          cat _config.yml

