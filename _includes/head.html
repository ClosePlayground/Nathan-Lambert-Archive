<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ full_title | escape }}</title>
<meta name="description" content="{{ meta_description | escape }}">
<meta name="author" content="Nathan Lambert Archive">
{% if page.robots %}
<meta name="robots" content="{{ page.robots }}">
{% else %}
<meta name="robots" content="index,follow,max-snippet:-1,max-image-preview:large">
{% endif %}
<link rel="canonical" href="{{ canonical }}">
<link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
<link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">
<link rel="sitemap" type="application/xml" href="{{ '/sitemap.xml' | absolute_url }}">
<link rel="alternate" type="application/atom+xml" title="Nathan Lambert Archive posts" href="{{ '/feed.xml' | absolute_url }}">
<meta name="theme-color" content="#173f52">
<meta property="og:type" content="{% if page.layout == 'post' or page.layout == 'video' %}article{% else %}website{% endif %}">
<meta property="og:title" content="{{ full_title | escape }}">
<meta property="og:description" content="{{ meta_description | escape }}">
<meta property="og:url" content="{{ canonical }}">
<meta property="og:site_name" content="{{ site.title | escape }}">
<meta property="og:locale" content="en_AU">
<meta property="og:image" content="{{ '/assets/og-image.png' | absolute_url }}">
<meta property="og:image:type" content="image/png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Nathan Lambert Archive">
{% if page.date_iso %}
<meta property="article:published_time" content="{{ page.date_iso }}">
<meta property="article:modified_time" content="{{ page.date_iso }}">
{% endif %}
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ full_title | escape }}">
<meta name="twitter:description" content="{{ meta_description | escape }}">
<meta name="twitter:image" content="{{ '/assets/og-image.png' | absolute_url }}">
<meta name="twitter:image:alt" content="Nathan Lambert Archive">
{% include schema.html %}
